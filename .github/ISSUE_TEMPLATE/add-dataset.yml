name: Add a dataset
description: Propose a time-series dataset, archive, benchmark, or competition.
title: "[Dataset]: "
labels: ["dataset"]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Canonical source
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: citation
    attributes:
      label: Paper or DOI

  - type: input
    id: license
    attributes:
      label: License or access terms
    validations:
      required: true

  - type: textarea
    id: metadata
    attributes:
      label: Suggested metadata
      description: Tasks, domain, structure, multivariate status, frequency, scale, and missing values.
    validations:
      required: true
